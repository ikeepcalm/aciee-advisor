services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: aciee
      POSTGRES_USER: aciee
      POSTGRES_PASSWORD: aciee
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
