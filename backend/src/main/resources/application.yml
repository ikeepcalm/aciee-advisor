spring:
  application:
    name: aciee-advisor
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aciee}
    username: ${DB_IDENT_USER:aciee_ident}
    password: ${DB_IDENT_PASSWORD:aciee_ident}
    hikari:
      pool-name: ident
      data-source-properties:
        ApplicationName: aciee-ident
  liquibase:
    user: ${DB_MIGRATOR_USER:aciee}
    password: ${DB_MIGRATOR_PASSWORD:aciee}
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: ${LIQUIBASE_CONTEXTS:prod}
  session:
    timeout: 30d
    jdbc:
      initialize-schema: never
      table-name: core.spring_session
  mvc:
    problemdetails:
      enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_SECURE:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_SECURE:false}
      mail.smtp.starttls.required: ${MAIL_SMTP_SECURE:false}

server:
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true
        same-site: lax

app:
  entra-tenant-id: ${ENTRA_TENANT_ID:445e5699-60fa-4f59-8e7f-778197a4d740}
  mail-from: ${MAIL_FROM:ACIEE Advisor <no-reply@localhost>}
  token-keys-dir: ${TOKEN_KEYS_DIR:token-keys}
  report-datasource:
    jdbc-url: ${spring.datasource.url}
    username: ${DB_REPORT_USER:aciee_report}
    password: ${DB_REPORT_PASSWORD:aciee_report}
    pool-name: report
    maximum-pool-size: 2
    read-only: true
    data-source-properties:
      ApplicationName: aciee-report
