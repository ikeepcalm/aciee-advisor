proxy_cache_path /var/cache/nginx/og levels=1:2 keys_zone=og_cache:10m max_size=200m inactive=1h use_temp_path=off;
limit_req_zone $binary_remote_addr zone=og_rate:10m rate=5r/s;

map $http_user_agent $link_preview_bot {
    default 0;
    ~*(whatsapp|telegrambot|facebookexternalhit|facebot|twitterbot|slackbot|discordbot|linkedinbot|skypeuripreview|viber|redditbot|pinterest|embedly|mastodon) 1;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;
    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-ancestors 'none'" always;

    location ^~ /og/ {
        limit_req zone=og_rate burst=20 nodelay;
        limit_req_status 429;
        proxy_cache og_cache;
        proxy_cache_valid 200 1h;
        proxy_cache_valid any 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ~ ^/(api|anon)/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires 1h;
    }

    location /assets/ {
        expires 1y;
    }

    location = /preview/ {
        return 301 /preview;
    }

    location /preview/ {
        expires 7d;
        try_files $uri @app;
    }

    location / {
        expires -1;
        try_files $uri @app;
    }

    location @app {
        if ($link_preview_bot) {
            rewrite ^(.*)$ /og$1 last;
        }
        expires -1;
        try_files /index.html =404;
    }
}
